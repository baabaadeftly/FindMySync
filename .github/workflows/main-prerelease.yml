name: Fastlane DMG Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: write-all

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Release MacOS app with Fastlane
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - uses: actions/cache@v4
        with:
          path: Pods
          key: ${{ runner.os }}-Pods-${{ hashFiles('./Podfile.lock') }}

      # Run fastlane directly rather than through maierj/fastlane-action, which
      # is unmaintained. stdin is redirected from /dev/null as a second guard
      # against tty-screen probing a non-terminal stdin.
      - name: Build DMG
        run: bundle exec fastlane release < /dev/null
        env:
          FASTLANE_SKIP_UPDATE_CHECK: '1'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FindMySync-dmg
          path: build/FindMySync.app.dmg
          if-no-files-found: warn

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Development Build
          prerelease: true
          files: build/FindMySync.app.dmg
